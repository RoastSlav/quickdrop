# "e2e" profile for the browser/HTTP-probe test instance — see docs/AGENTIC_TEST_PLAN.md.
# Started via the "quickdrop-e2e" launch.json config on port 8081, fully isolated from the
# developer's real db/, files/, log/ at the repo root.
#
# NOTE: the settings row's fileStoragePath still seeds to the DB-default "files" (relative
# to CWD) on first boot — scripts/seed-e2e.sh's first step re-points it at e2e-data/files
# via POST /admin/api/save before any upload happens, exactly as a real admin would.
# Both paths are flat (directly under e2e-data/, no subfolders): Spring Boot's logging
# init runs before Flyway/DataSource bean creation and auto-creates its log file's parent
# dir (e2e-data/), which SQLite's JDBC driver then finds already present -- unlike SQLite,
# it does not create parent directories itself.
management.endpoints.web.exposure.include=health,mappings
spring.datasource.url=jdbc:sqlite:e2e-data/e2e.db?journal_mode=WAL
logging.file.name=e2e-data/e2e.log
server.port=8081
