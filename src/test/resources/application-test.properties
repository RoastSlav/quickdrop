# Test profile for Layer 1 (JUnit/MockMvc) tests — see docs/TESTING.md.
#
# Each Spring ApplicationContext gets its own throwaway SQLite file and log file under
# target/, keyed by a fresh random UUID. Contexts with identical configuration are cached
# and reused by Spring (sharing a DB, which is correct — they're the same test config);
# distinct configurations never collide or lock each other's SQLite file.
#
# busy_timeout: the per-test settings write can overlap background threads still
# committing from the previous test, which failed CI with SQLITE_BUSY.
spring.datasource.url=jdbc:sqlite:target/test-data/${random.uuid}.db?journal_mode=WAL&busy_timeout=5000
logging.file.name=target/test-data/${random.uuid}.log
server.port=0

# NOTE: ApplicationSettingsService seeds fileStoragePath="files" (relative to CWD) on first
# boot of a fresh settings row — that is NOT overridden here because it isn't a Spring
# property, it's a DB-seeded default. Any test that exercises real file storage I/O MUST
# redirect it to a @TempDir explicitly (e.g. via QuickdropIntegrationTest base class) before
# writing — otherwise it will write into the real repo files/ directory.
