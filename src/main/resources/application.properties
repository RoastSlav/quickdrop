spring.profiles.active=default
spring.application.name=quickdrop
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.url=jdbc:sqlite:db/quickdrop.db?journal_mode=WAL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.connection-timeout=60000
spring.mvc.async.request-timeout=3600000
logging.file.name=log/quickdrop.log
server.error.path=/error
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG
#logging.level.org.springframework.security=DEBUG
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
app.version=2.0.0-dev
spring.cloud.compatibility-verifier.enabled=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
# Comma-separated allowed origins for credentialed CORS (leave * for open/anonymous access)
quickdrop.cors.allowed-origins=*
# Raise multipart/form limits so the admin settings form (many fields + logo) is accepted.
# Tomcat 10.1 defaults to 10 multipart parts; the settings form has 30+.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-parameter-count=500
