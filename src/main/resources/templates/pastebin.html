<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{::head-extra})}">
    <title th:text="#{page.paste.title.browser(${appName})}">Pastebin — QuickDrop</title>
    <th:block th:fragment="head-extra">
        <link href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="/js/dompurify.min.js"></script>
    </th:block>
</head>
<body>

<th:block th:replace="~{fragments/layout :: chrome(false)}"></th:block>

<main class="paste-shell" id="main-content">
    <form class="paste-form" id="pasteForm" method="post" th:action="${pasteFormAction}"
          x-data="{ options: false }">
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>

        <!-- Bar: the paste's own name, plus the two controls you always need. -->
        <div class="paste-bar">
            <label class="sr-only" for="pasteTitle" th:text="#{page.paste.field.title}">Title</label>
            <input class="paste-title" id="pasteTitle" maxlength="255" name="title" required
                   placeholder="Untitled paste" th:placeholder="#{page.paste.title.placeholder}"
                   th:value="${pasteTitle}" type="text"/>
            <div class="paste-bar-actions">
                <button :aria-expanded="options ? 'true' : 'false'" @click="options = !options"
                        aria-controls="pasteOptions" class="btn btn-ghost btn-sm" type="button">
                    <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8"
                         viewBox="0 0 24 24">
                        <path d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span th:text="#{page.paste.options}">Options</span>
                </button>
                <button class="btn btn-primary btn-sm" id="savePasteButton" th:disabled="${s3Down}"
                        th:text="${isEditMode} ? #{page.paste.saveChanges} : #{page.paste.save}"
                        type="submit">Save
                </button>
            </div>
        </div>

        <!-- Everything that is not writing lives here, one keystroke away. -->
        <div class="paste-options" id="pasteOptions" x-cloak x-show="options">
            <div class="paste-options-grid">

                <div class="form-row">
                    <label class="form-label" for="syntax" th:text="#{page.paste.field.mode}">Mode</label>
                    <select class="form-input" id="syntax" name="syntax">
                        <option th:selected="${pasteSyntax != 'markdown'}" th:text="#{page.paste.mode.text}"
                                value="text">Plain Text (.txt)
                        </option>
                        <option th:selected="${pasteSyntax == 'markdown'}" th:text="#{page.paste.mode.markdown}"
                                value="markdown">Markdown (.md)
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <label class="form-label" for="fontSizeSelect" th:text="#{page.paste.fontSize}">Font size</label>
                    <select class="form-input" id="fontSizeSelect">
                        <option value="12px">12</option>
                        <option selected value="14px">14</option>
                        <option value="16px">16</option>
                        <option value="18px">18</option>
                    </select>
                </div>

                <div class="form-row">
                    <span class="form-label" th:text="#{page.paste.editorSettings}">Editor</span>
                    <label class="form-check">
                        <input id="lineNumbersToggle" type="checkbox"/>
                        <span th:text="#{page.paste.lineNumbers}">Line numbers</span>
                    </label>
                    <label class="form-check">
                        <input checked id="wordWrapToggle" type="checkbox"/>
                        <span th:text="#{page.paste.wordWrap}">Word wrap</span>
                    </label>
                </div>

            </div>

            <!-- Protection and lifetime: uniform cards, so the tall password cell can't
                 stretch a row of short editor fields and leave a void beside them. -->
            <div class="paste-options-cards">

                <!-- On edit, blank means "leave password unchanged", not "remove" -- a password field
                     can't be pre-filled with the real value, so blank=remove would strip protection
                     on any edit where the password isn't retyped (see PasteService#updatePaste). -->
                <div class="paste-option-card" id="passwordSection" th:if="${uploadPasswordEnabled}">
                    <div class="form-row">
                        <label class="form-label" for="password" th:text="#{page.paste.password.label}">Password
                            (optional)</label>
                        <input class="form-input" id="password" name="password"
                               placeholder="Set password to protect this paste"
                               th:placeholder="${isEditMode} ? #{page.paste.password.placeholder.edit} : #{page.paste.password.placeholder}"
                               type="password"/>
                        <p class="form-hint"
                           th:text="${isEditMode} ? #{page.paste.password.help.edit} : #{page.paste.password.help}">Leave
                            empty to remove password protection.</p>
                    </div>

                    <!-- Password scope: shown only when password field has text (create mode only) -->
                    <div class="paste-option-subsection" id="editOnlySection" th:if="${!isEditMode}"
                         style="display:none">
                        <p class="text-sm font-semibold" th:text="#{page.paste.field.editOnly}">Password scope</p>
                        <label class="form-check">
                            <input checked id="editOnly_viewAndEdit" name="editOnly" type="radio" value="false"/>
                            <span class="text-sm" th:text="#{page.paste.editOnly.viewAndEdit}">Password required for viewing and editing</span>
                        </label>
                        <label class="form-check">
                            <input id="editOnly_editOnly" name="editOnly" type="radio" value="true"/>
                            <span class="text-sm" th:text="#{page.paste.editOnly.editOnly}">Password required for editing only (content is publicly visible)</span>
                        </label>
                    </div>
                </div>

                <div class="paste-option-card paste-option-card--toggle">
                    <label class="toggle">
                        <input id="immutableToggle" name="immutable" th:checked="${isImmutable}"
                               type="checkbox" value="true"/>
                        <span class="toggle-slider"></span>
                    </label>
                    <div>
                        <p class="text-sm font-semibold" th:text="#{page.paste.field.immutable}">Lock paste (immutable)</p>
                        <p class="text-xs" style="color:var(--c-text-muted)" th:text="#{page.paste.field.immutable.help}">Once saved, the paste content can no longer be edited.</p>
                    </div>
                </div>

                <div class="paste-option-card paste-option-card--toggle" th:if="${canUseKeepIndefinitely}">
                    <label class="toggle">
                        <input name="keepIndefinitely" th:checked="${keepIndefinitely}" type="checkbox" value="true"/>
                        <span class="toggle-slider"></span>
                    </label>
                    <div>
                        <p class="text-sm font-semibold" th:text="#{form.keepIndefinitely}">Keep indefinitely</p>
                        <p class="text-xs" style="color:var(--c-text-muted)"
                           th:text="#{page.paste.keepIndefinitely.help}">The paste is never removed by the scheduled cleanup.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="alert alert-danger paste-flash" th:if="${pasteError != null}" th:text="${pasteError}"></div>


                <div class="alert alert-danger flex items-center gap-3" role="alert" th:if="${s3Down}">
                    <svg aria-hidden="true" class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor"
                         stroke-width="2" viewBox="0 0 24 24">
                        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span th:text="#{alert.pastesUnavailable}">Pastes are temporarily unavailable.</span>
        </div>

        <div class="editor-wrapper paste-editor">
                <div class="custom-editor-toolbar" id="customEditorToolbar">
                    <button aria-label="Bold" data-action="bold" title="Bold" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path d="M6 4h7a4 4 0 1 1 0 8H6z"/>
                            <path d="M6 12h8a4 4 0 1 1 0 8H6z"/>
                        </svg>
                    </button>
                    <button aria-label="Italic" data-action="italic" title="Italic" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <line x1="19" x2="10" y1="4" y2="4"/>
                            <line x1="14" x2="5" y1="20" y2="20"/>
                            <line x1="15" x2="9" y1="4" y2="20"/>
                        </svg>
                    </button>
                    <button aria-label="Heading" data-action="heading" title="Heading" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path d="M5 4v16"/>
                            <path d="M19 4v16"/>
                            <path d="M5 12h14"/>
                        </svg>
                    </button>
                    <button aria-label="Quote" data-action="quote" title="Quote" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path d="M8 17H5a2 2 0 0 1-2-2v-3a6 6 0 0 1 6-6h1"/>
                            <path d="M19 17h-3a2 2 0 0 1-2-2v-3a6 6 0 0 1 6-6h1"/>
                        </svg>
                    </button>
                    <button aria-label="Bulleted list" data-action="unordered-list" title="Bulleted list"
                            type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <line x1="9" x2="20" y1="6" y2="6"/>
                            <line x1="9" x2="20" y1="12" y2="12"/>
                            <line x1="9" x2="20" y1="18" y2="18"/>
                            <circle cx="4" cy="6" r="1"/>
                            <circle cx="4" cy="12" r="1"/>
                            <circle cx="4" cy="18" r="1"/>
                        </svg>
                    </button>
                    <button aria-label="Numbered list" data-action="ordered-list" title="Numbered list"
                            type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <line x1="9" x2="20" y1="6" y2="6"/>
                            <line x1="9" x2="20" y1="12" y2="12"/>
                            <line x1="9" x2="20" y1="18" y2="18"/>
                            <path d="M4 7V5l-1 1"/>
                            <path d="M3 11h2l-2 3h2"/>
                            <path d="M3 17c0-.7.5-1.2 1.2-1.2H5v2.4"/>
                        </svg>
                    </button>
                    <button aria-label="Insert link" data-action="link" title="Insert link" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path d="M10 13a5 5 0 0 1 0-7l1.5-1.5a5 5 0 0 1 7 7L17 13"/>
                            <path d="M14 11a5 5 0 0 1 0 7L12.5 19.5a5 5 0 0 1-7-7L7 11"/>
                        </svg>
                    </button>
                    <button aria-label="Insert image" data-action="image" title="Insert image" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <rect height="16" rx="2" width="18" x="3" y="4"/>
                            <circle cx="8.5" cy="9" r="1.5"/>
                            <path d="M21 16l-4.5-4.5L7 21"/>
                        </svg>
                    </button>
                    <button aria-label="Insert table" data-action="table" title="Insert table" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <rect height="16" rx="2" width="18" x="3" y="4"/>
                            <path d="M3 10h18"/>
                            <path d="M9 4v16"/>
                            <path d="M15 4v16"/>
                        </svg>
                    </button>
                    <button aria-label="Code block" data-action="code" title="Code block" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <polyline points="8 6 2 12 8 18"/>
                            <polyline points="16 6 22 12 16 18"/>
                        </svg>
                    </button>
                    <button aria-label="Horizontal rule" data-action="hr" title="Horizontal rule" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <line x1="3" x2="21" y1="12" y2="12"/>
                        </svg>
                    </button>
                    <button aria-label="Preview" aria-pressed="false" class="preview-tool-button"
                            data-action="preview"
                            id="previewToolButton" title="Preview" type="button">
                        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                             stroke-width="2" viewBox="0 0 24 24">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <span th:text="#{page.paste.preview}">Preview</span>
                    </button>
                </div>
                <textarea id="content" name="content" placeholder="Write your text here…"
                          th:placeholder="#{page.paste.content.placeholder}" th:text="${pasteContent}"></textarea>
                <div class="manual-preview-pane markdown-content" id="manualPreviewPane"></div>
        </div>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<script th:inline="javascript">
    const emptyPasteMessage = /*[[#{page.paste.content.empty}]]*/ "Paste content cannot be empty.";
    const markedApi = window.marked;
    const markdownRuntimeAvailable = !!markedApi && typeof markedApi.setOptions === "function" && typeof markedApi.parse === "function";
    if (markdownRuntimeAvailable) markedApi.setOptions({gfm: true, breaks: true});

    function renderMarkdownLikePasteView(plainText) {
        if (markdownRuntimeAvailable) {
            try {
                return markedApi.parse(plainText);
            } catch (_) {
            }
        }
        return this.parent.markdown(plainText);
    }

    const editor = new EasyMDE({
        element: document.getElementById("content"),
        spellChecker: false,
        autoDownloadFontAwesome: false,
        status: ["lines", "words", "cursor"],
        toolbar: false,
        previewRender: renderMarkdownLikePasteView,
    });

    const lineNumbersToggle = document.getElementById("lineNumbersToggle");
    const wordWrapToggle = document.getElementById("wordWrapToggle");
    const fontSizeSelect = document.getElementById("fontSizeSelect");
    const form = document.getElementById("pasteForm");
    const savePasteButton = document.getElementById("savePasteButton");
    const textarea = document.getElementById("content");
    const customEditorToolbar = document.getElementById("customEditorToolbar");
    const syntaxSelect = document.getElementById("syntax");
    const previewToolButton = document.getElementById("previewToolButton");
    const editorWrapper = document.querySelector(".editor-wrapper");
    const manualPreviewPane = document.getElementById("manualPreviewPane");

    function isPreviewActive() {
        return !!(editorWrapper && editorWrapper.classList.contains("manual-preview-active"));
    }

    function escapeHtml(v) {
        return v.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function renderPreviewContent() {
        if (!manualPreviewPane) return;
        const txt = editor.value();
        if (markdownRuntimeAvailable) {
            try {
                const rawHtml = markedApi.parse(txt);
                if (typeof DOMPurify !== 'undefined') {
                    manualPreviewPane.innerHTML = DOMPurify.sanitize(rawHtml);
                } else {
                    manualPreviewPane.textContent = txt; // Plain text fallback — safe but unformatted
                }
                return;
            } catch (_) {
            }
        }
        manualPreviewPane.innerHTML = `<pre class="whitespace-pre-wrap break-words">${escapeHtml(txt)}</pre>`;
    }

    function syncPreviewButtonState() {
        const active = isPreviewActive();
        previewToolButton.setAttribute("aria-pressed", active ? "true" : "false");
        if (editorWrapper) editorWrapper.classList.toggle("manual-preview-active", active);
    }

    const editorActions = {
        bold: EasyMDE.toggleBold, italic: EasyMDE.toggleItalic, heading: EasyMDE.toggleHeadingSmaller,
        quote: EasyMDE.toggleBlockquote, "unordered-list": EasyMDE.toggleUnorderedList,
        "ordered-list": EasyMDE.toggleOrderedList, link: EasyMDE.drawLink, image: EasyMDE.drawImage,
        table: EasyMDE.drawTable, code: EasyMDE.toggleCodeBlock, hr: EasyMDE.drawHorizontalRule,
        preview: () => {
            const nextActive = !isPreviewActive();
            if (nextActive) renderPreviewContent();
            if (editorWrapper) editorWrapper.classList.toggle("manual-preview-active", nextActive);
            syncPreviewButtonState();
        },
    };

    customEditorToolbar.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;
        const action = editorActions[btn.dataset.action];
        if (typeof action === "function") {
            action(editor);
            if (!isPreviewActive()) editor.codemirror.focus();
        }
    });

    function applyEditorSettings() {
        editor.codemirror.setOption("lineNumbers", lineNumbersToggle.checked);
        editor.codemirror.setOption("lineWrapping", wordWrapToggle.checked);
        editor.codemirror.getWrapperElement().style.fontSize = fontSizeSelect.value;
    }

    lineNumbersToggle.addEventListener("change", applyEditorSettings);
    wordWrapToggle.addEventListener("change", applyEditorSettings);
    fontSizeSelect.addEventListener("change", applyEditorSettings);
    applyEditorSettings();

    function applyModeControls() {
        const md = syntaxSelect.value === "markdown";
        previewToolButton.classList.toggle("hidden", !md);
        if (!md && isPreviewActive()) editorWrapper && editorWrapper.classList.remove("manual-preview-active");
        syncPreviewButtonState();
    }

    editor.codemirror.on("change", () => {
        if (isPreviewActive()) renderPreviewContent();
    });
    syntaxSelect.addEventListener("change", applyModeControls);
    applyModeControls();

    form.addEventListener("submit", (e) => {
        const val = editor.value().trim();
        textarea.value = editor.value();
        if (!val) {
            e.preventDefault();
            window.notify(emptyPasteMessage);
            editor.codemirror.focus();
            return;
        }
        savePasteButton.disabled = true;
        savePasteButton.classList.add("opacity-70", "cursor-not-allowed");
    });

    // Show/hide editOnly scope section based on whether a password has been entered
    const passwordField = document.getElementById("password");
    const editOnlySection = document.getElementById("editOnlySection");
    if (passwordField && editOnlySection) {
        function syncEditOnlyVisibility() {
            const hasPassword = passwordField.value.trim().length > 0;
            editOnlySection.style.display = hasPassword ? "" : "none";
            if (!hasPassword) {
                // Reset to default (view+edit) when password is cleared
                const viewAndEditRadio = document.getElementById("editOnly_viewAndEdit");
                if (viewAndEditRadio) viewAndEditRadio.checked = true;
            }
        }
        passwordField.addEventListener("input", syncEditOnlyVisibility);
        syncEditOnlyVisibility();
    }
</script>
<th:block th:replace="~{fragments/layout :: pageScripts}"></th:block>
</body>
</html>
