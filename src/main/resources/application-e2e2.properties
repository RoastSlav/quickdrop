# Second isolated e2e instance -- see application-e2e.properties for the general pattern.
# Used by Layer 2 Track D (endpoint contract + round trips) so it never shares state with
# Track C (security probes) on quickdrop-e2e/8081.
management.endpoints.web.exposure.include=health,mappings
spring.datasource.url=jdbc:sqlite:e2e-data-2/e2e.db?journal_mode=WAL
logging.file.name=e2e-data-2/e2e.log
server.port=8082
