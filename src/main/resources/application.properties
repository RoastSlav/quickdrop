spring.profiles.active=default
spring.application.name=quickdrop
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.url=jdbc:sqlite:db/quickdrop.db?journal_mode=WAL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.tomcat.connection-timeout=60000
spring.mvc.async.request-timeout=3600000
# Tomcat's request-handling executor and Spring's default @Async executor run on virtual
# threads. The app's own manually-created thread pools (AsyncFileMergeService,
# NotificationService) are converted separately -- this setting alone doesn't touch them.
spring.threads.virtual.enabled=true
logging.file.name=log/quickdrop.log
# Structured JSON logging for the log file only -- console stays human-readable for
# local dev / `docker logs`. Makes log/quickdrop.log ingestible by log aggregators.
logging.structured.format.file=logstash
server.error.path=/error
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate=DEBUG
#logging.level.org.springframework.security=DEBUG
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
app.version=2.0.0-dev
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
# Comma-separated allowed origins for credentialed CORS (leave * for open/anonymous access)
quickdrop.cors.allowed-origins=*
# Raise multipart/form limits so the admin settings form (many fields + logo) is accepted.
# Tomcat 10.1 defaults to 10 multipart parts; the settings form has 100+ (fields + hidden inputs).
# max-parameter-count controls URL/form parameter count; maxCountOfParts is set programmatically.
# (spring.servlet.multipart.max-file-size / max-request-size are NOT set here: MultipartConfig
# supplies its own MultipartConfigElement bean reading live from application settings, and
# Boot's own multipart auto-configuration is @ConditionalOnMissingBean, so these properties
# would have no effect.)
server.tomcat.max-parameter-count=500
